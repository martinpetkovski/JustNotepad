<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustNotepad</title>
    <link rel="icon" href="icon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="content">Loading...</div>
    <script>
        const markdown = `# JustNotepad

A notepad that opens anything in a blink, from a shopping list to a 10 GB log file.

[Download for Windows](https://github.com/martinpetkovski/JustNotepad/releases/latest/download/JustNotepad-Setup.exe)

Close it whenever you like. Your tabs and notes are right where you left them next time.

Code comes in color, Markdown looks the way it reads, and if you work with Git or Perforce you can see exactly what you changed.

Made by [Martin Petkovski](https://www.najjak.com/)
`;
        document.getElementById('content').innerHTML = marked.parse(markdown);
    </script>
</body>
</html>
